<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarryBee · Tracker and issue drawer · web view</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bee:#FFCC00;--bee-soft:#FDE68A;--ink:#08090B;
  --mint:#00E5A0;--mint-ink:#0A7A56;--flare:#FF5470;--flare-ink:#C81E3F;
  --azure:#37A9FF;--azure-ink:#1F6FD1;--violet:#A78BFA;--violet-ink:#6D4AD6;
  --paper:#F6F5F1;--card:#FFFFFF;--line:#E5E3DB;--line2:#EFEDE7;--track:#EFEDE7;--grid:#EEECE6;--mut:#6B6F78;--text:#111216;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#E9E7E0;color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:26px;display:block}
.brand small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:600;border-left:1px solid var(--line);padding-left:14px}
.tabs{margin-left:auto;display:flex;gap:4px;background:#F1F0EB;padding:4px;border-radius:12px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;font:600 13px var(--font);color:var(--mut);padding:8px 12px;border-radius:9px;cursor:pointer}
.tabs button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs button:focus-visible{outline:2px solid var(--bee)}
main{max-width:1280px;margin:0 auto;padding:28px 24px 56px}
.view{display:none}.view.on{display:block}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 20px}
.kicker{display:flex;align-items:center;gap:8px;font:600 11px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:8px 0 4px;font-weight:700}
h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.005em}
h3{font-size:13px;font-weight:600;margin:0 0 6px}
.sub{color:var(--mut);max-width:640px;margin:0}
.muted{color:var(--mut)}
.small{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-h small{color:var(--mut);font-size:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.stack{display:grid;gap:16px;align-content:start}
.mt{margin-top:16px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic.lg{width:28px;height:28px}
.ic.xl{width:40px;height:40px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font:600 11.5px var(--font);white-space:nowrap}
.p-urg{background:#FFE4E9;color:var(--flare-ink)}
.p-crit{background:#FFF3C2;color:#7A5B00}
.p-reg{background:#E3FBF3;color:var(--mint-ink)}
.p-breach{background:var(--flare);color:#fff}
.p-ok{background:#E3FBF3;color:var(--mint-ink)}
.p-wait{background:#EAF3FE;color:var(--azure-ink)}
.p-res{background:#F0EEE8;color:var(--mut)}
.mono{font-family:var(--mono);font-size:12.5px;font-weight:500;letter-spacing:0}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{font:500 10.5px var(--font);fill:var(--mut)}
.chart .val{font:600 11px var(--font);fill:var(--text)}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .gv{font:700 26px var(--font);fill:var(--text)}
.spark{width:100%;height:40px;display:block;margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%}
.hbar{display:grid;grid-template-columns:112px 1fr 40px;align-items:center;gap:12px;margin:10px 0;font-size:13px}
.hbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.hbar .fill{height:100%;border-radius:99px}
.hbar b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.stackbar{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:3px}
.stackbar i{display:block;height:100%;border-radius:99px}
.donut{position:relative;width:max-content}
.donut svg{display:block}
.donut .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut .dc b{font:700 24px var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.donut .dc span{font-size:11px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.kpi{padding:18px 20px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi .lab{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12.5px;font-weight:500}
.kpi .num{font:700 34px/1.1 var(--font);letter-spacing:-.03em;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.delta{font-size:12px;font-weight:600}
.good{color:var(--mint-ink)}
.bad{color:var(--flare-ink)}
table{width:100%;border-collapse:collapse}
th{font:600 11px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:middle;font-size:13px}
tr:last-child td{border-bottom:0}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:600 13px var(--font);color:var(--text);cursor:default}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.bee{background:var(--bee);border-color:var(--bee);color:var(--ink)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg span{padding:6px 10px;border-radius:8px;font:600 12.5px var(--font);color:var(--mut)}
.seg .on{background:var(--ink);color:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mint)}
.live{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(0,229,160,.18)}
.swatch{height:64px;border-radius:12px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;font:600 12px var(--font)}
.swatch small{font:500 11px var(--mono);opacity:.8}
.search{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--mut);min-width:280px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 12.5px var(--font);color:var(--mut)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip b{font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--mut);margin-top:16px}

/* Concept A · quiet ledger */
.kpi-a .num{font-size:36px}

/* Concept B · ink console (dark) */
.dark{background:var(--ink);color:var(--text);border-radius:22px;padding:22px}
.dk{--paper:#08090B;--card:#111317;--line:#22252C;--line2:#1A1D23;--track:#22252C;--grid:#1C1F25;--mut:#8B919B;--text:#F4F4F5;color:var(--text)}
.dk .p-urg{background:rgba(255,84,112,.16);color:#FF8DA0}
.dk .p-crit{background:rgba(255,204,0,.14);color:#FFD84D}
.dk .p-reg{background:rgba(0,229,160,.14);color:#4DF5BC}
.dk .p-wait{background:rgba(55,169,255,.16);color:#7CC3FF}
.dk .p-res{background:rgba(255,255,255,.06);color:#A3A9B3}
.dk .good{color:#4DF5BC}
.dk .bad{color:#FF8DA0}
.dk .btn{background:#16181D;border-color:#2A2E36;color:var(--text)}
.dk .chip{background:#16181D;border-color:#2A2E36}
.dk .chip.on{background:var(--bee);color:var(--ink);border-color:var(--bee)}
.dk .seg{background:#16181D;border-color:#2A2E36}
.dk .seg .on{background:var(--bee);color:var(--ink)}
.dk .kpis{background:var(--card)}
.dk .search{background:#16181D;border-color:#2A2E36}
.cmd{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cmd h1{font-size:28px}
.b-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.tile-num{font:700 40px/1 var(--font);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.flag{width:8px;height:8px;border-radius:50%;background:var(--flare);display:inline-block;margin-right:8px;vertical-align:middle}

/* Concept C · focus split */
.split{grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:start}
.q{display:grid;gap:12px}
.qi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.qi .meta{color:var(--mut);font-size:12.5px}
.qi .bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:8px}
.qi .bar i{display:block;height:100%;border-radius:99px}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;background:var(--ink);color:var(--bee);font:700 11px var(--font);flex:none}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.stage{position:relative;padding:14px 18px;border-right:1px solid var(--line)}
.stage:last-child{border-right:0}
.stage .n{font:700 26px var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stage .bar{height:6px;border-radius:99px;background:var(--track);margin-top:10px;overflow:hidden}
.stage .bar i{display:block;height:100%;background:var(--ink);border-radius:99px}

/* Concept D · bento */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;min-width:0;display:flex;flex-direction:column}
.tile .lab{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);font-weight:500}
.tile .big{font:700 40px/1 var(--font);letter-spacing:-.03em;margin-top:14px;font-variant-numeric:tabular-nums}
.span2{grid-column:span 2}
.span3{grid-column:span 3}
.span4{grid-column:span 4}
.tall{grid-row:span 2}
.t-bee{background:var(--bee);border-color:var(--bee);color:var(--ink)}
.t-bee .lab,.t-bee small{color:rgba(8,9,11,.7)}
.t-ink{background:var(--ink);border-color:var(--ink);color:#fff}
.t-ink .lab{color:#A3A9B3}
.t-ink .gv{fill:#fff}
.tile .foot{margin-top:auto;padding-top:12px}

/* System page */
.sys-sec{margin-top:28px}
.sys-sec>h2{margin-bottom:12px;font-size:17px}
.sw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.type-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line2)}
.type-row:last-child{border-bottom:0}
.logo-tile{border-radius:16px;padding:28px;display:grid;place-items:center;min-height:150px;border:1px solid var(--line)}
.logo-tile img{width:200px;height:auto;display:block}
.rules li{margin:6px 0}

/* Icons page */
.ic-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.ic-tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.ic-tile .ic{color:var(--ink)}
.ic-tile b{font-size:13px;font-weight:600}
.ic-tile span{font-size:12px;color:var(--mut)}
.ic-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ic-row .ic{color:var(--ink)}

@media (max-width: 1000px){
  .g3,.g2,.split,.b-main{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi:nth-child(2){border-right:0}
  .kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .bento{grid-template-columns:1fr 1fr}
  .span3,.span4{grid-column:span 2}
  .ic-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sw-grid{grid-template-columns:1fr 1fr}
  .pipe{grid-template-columns:1fr 1fr}
  .search{min-width:0;width:100%}
}
@media (max-width: 640px){
  main{padding:18px 14px 40px}
  .top-in{padding:10px 14px}
  .tabs{margin-left:0;width:100%}
  .tabs button{flex:1 1 auto;min-height:44px}
  h1{font-size:24px}
  .kpis{grid-template-columns:1fr}
  .kpi{border-right:0;border-bottom:1px solid var(--line)}
  .bento{grid-template-columns:1fr}
  .span2,.span3,.span4,.tall{grid-column:auto;grid-row:auto}
  .ic-grid{grid-template-columns:1fr 1fr}
  .hbar{grid-template-columns:96px 1fr 36px}
  .pipe{grid-template-columns:1fr}
  .stage{border-right:0;border-bottom:1px solid var(--line)}
}

/* ---- App chrome (v4): logo left with name beside it, icon buttons, role inside Sign out, tabs centred under the bar ---- */
.app-top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.app-bar{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.app-bar .logo{height:28px;display:block}
.app-bar .div{width:1px;height:28px;background:var(--line);flex:none}
.who{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;min-width:0}
.who .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#F1F0EB;border:1px solid var(--line);font:700 12px var(--font);color:var(--ink2);flex:none}
.who .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.clock{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:999px;background:#E3FBF3;color:var(--mint-ink);font-size:12px;font-weight:600;margin-right:6px;white-space:nowrap}
.clock i{width:7px;height:7px;border-radius:50%;background:var(--mint-ink)}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink2);padding:0;cursor:default}
.signout{height:40px;display:inline-flex;align-items:center;gap:10px;padding:0 14px 0 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;color:var(--text);cursor:default}
.signout svg{color:var(--mut)}
.signout .txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;text-align:left}
.signout b{font-size:13px;font-weight:700}
.signout small{font:500 11px var(--mono);color:var(--mut);margin-top:2px}
.app-tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;width:max-content;max-width:100%;margin:0 auto 4px;padding:4px;background:#F1F0EB;border:1px solid var(--line);border-radius:14px}
.app-tabs a{height:38px;display:inline-flex;align-items:center;padding:0 14px;border-radius:10px;color:var(--mut);font-weight:600;font-size:13.5px;text-decoration:none;white-space:nowrap}
.app-tabs a:hover{color:var(--text)}
.app-tabs a.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.app-tabs a.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--bee);margin-right:8px;box-shadow:0 0 0 3px rgba(255,204,0,.25)}
.app-tabs a:focus-visible{outline:2px solid var(--bee)}
.app-wrap{max-width:1280px;margin:0 auto;padding:12px 24px 56px}
.page{display:none}
.page.on{display:block}
.seg span[data-mode]{cursor:pointer}

/* ---- Dashboard: desktop vs phone summary ---- */
.phone-only{display:none}
.mode-phone .phone-only{display:block}
.mode-phone .desk{display:none}
.phone{width:390px;max-width:100%;margin:0 auto;padding:14px;border:1px solid var(--line);border-radius:28px;background:var(--paper)}
.phone .tile{padding:16px}
.ptwo{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---- Forms ---- */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--mut)}
.input{min-height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px}
.hubnote{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#E3FBF3;color:#0A4D36;font-size:13px}
.okdot{width:8px;height:8px;border-radius:50%;background:var(--mint-ink);margin-top:6px;flex:none}
.check{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink2)}
.dropzone{border:1.5px dashed var(--line2);border-radius:12px;padding:18px;display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;background:#FBFAF7}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line2)}
.step:last-child{border-bottom:0}
.step .ic{margin-top:2px;color:var(--ink)}
.search{min-width:300px}

@media (max-width: 900px){
  .fgrid{grid-template-columns:1fr}
  .app-tabs{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;width:100%;max-width:100%;scrollbar-width:none}
  .app-tabs::-webkit-scrollbar{display:none}
  .app-tabs a{min-height:44px;height:44px;flex:0 0 auto}
  .who .nm{max-width:150px}
}
@media (max-width: 640px){
  .app-bar{padding:10px 14px;gap:10px}
  .app-bar .logo{height:24px}
  .app-bar .div,.clock,.signout .txt,.who .av{display:none}
  .who .nm{font-size:13px;max-width:120px}
  .app-wrap{padding:10px 14px 40px}
  .ibtn,.signout{min-height:40px}
  .search{min-width:0;width:100%}
  .ptwo{grid-template-columns:1fr 1fr}
}

/* ---------- final demo: header, folder tabs, sheet ---------- */
:root{--bg:#F4F3EF;--surface:#FFFFFF;--ink2:#34343C}
body{background:var(--bg);margin:0}
.demo-bar{max-width:1280px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--mut)}
.seg2{display:inline-flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg2 button{height:28px;padding:0 10px;border:0;border-radius:7px;background:transparent;font:600 12px var(--font,Inter,sans-serif);color:var(--mut);cursor:pointer}
.seg2 button.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.shell{max-width:1280px;margin:0 auto;min-height:100vh}
.hdr{background:transparent}
.hdrbar{display:flex;align-items:center;gap:12px;height:64px;padding:0 24px}
.brand{display:flex;align-items:center;min-width:0}
.logo{height:24px;display:block;flex:none}
.tools{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.time{font-size:12.5px;font-weight:500;color:var(--mut);font-variant-numeric:tabular-nums;margin-right:10px;white-space:nowrap}
.ibtn{position:relative;width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--ink2);display:grid;place-items:center;padding:0;cursor:pointer}
.ibtn:hover{background:var(--paper)}
.ibtn .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--bee);box-shadow:0 0 0 2px var(--bg)}
.signout{height:40px;display:inline-flex;align-items:center;gap:8px;margin-left:8px;padding:0 8px 0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:inherit;color:var(--ink);cursor:pointer}
.signout .ic{width:17px;height:17px;color:var(--mut)}
.who-name{font-size:13px;font-weight:700;letter-spacing:.02em;line-height:1;white-space:nowrap}
.role{font:500 10.5px var(--mono,ui-monospace,monospace);color:var(--ink2);background:var(--paper);border-radius:5px;padding:2px 6px}
.folders{display:flex;align-items:flex-end;gap:4px;padding:16px 24px 0;overflow-x:auto;scrollbar-width:none}
.folders::-webkit-scrollbar{display:none}
.folder{position:relative;flex:0 0 auto;height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 16px;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:var(--paper);color:var(--mut);font-weight:600;font-size:13.5px;text-decoration:none;white-space:nowrap}
.folder .ic{width:17px;height:17px}
.folder:hover{color:var(--ink2)}
.folder.on{height:46px;background:var(--surface);color:var(--ink);font-weight:700;margin-bottom:-1px;z-index:2}
.folder.on::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:3px;background:var(--bee);border-radius:12px 12px 0 0}
.folder:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sheet{position:relative;z-index:1;margin:0 24px 24px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
@media (max-width:640px){
  .demo-bar{padding:8px 12px;flex-wrap:wrap}
  .hdrbar{height:58px;padding:0 12px;gap:8px}
  .logo{height:20px}
  .time{display:none}
  .tools{gap:2px}
  .ibtn{width:36px;height:36px}
  .signout{margin-left:4px;padding:0 6px 0 8px;gap:6px}
  .folders{padding:12px 12px 0;gap:4px}
  .folder{height:42px;padding:0 12px;font-size:13px}
  .folder.on{height:44px}
  .sheet{margin:0 12px 14px;padding:16px}
}

/* ---------- complete views: tracker rows and issue drawer ---------- */
.qi{cursor:pointer}
.qi:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dr-overlay{position:fixed;inset:0;z-index:60;display:none}
.dr-overlay.on{display:block}
.dr-scrim{position:absolute;inset:0;background:rgba(23,23,28,.2)}
.dr-panel{position:absolute;top:0;right:0;bottom:0;width:540px;max-width:100%;background:#fff;border-left:1px solid var(--line);box-shadow:-24px 0 48px -32px rgba(23,23,28,.35);display:flex;flex-direction:column;color:var(--ink)}
.dr-grab{display:none}
.dr-h{padding:18px 22px 0;border-bottom:1px solid var(--line)}
.dr-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dr-id{font:600 12px var(--mono);color:var(--ink2);background:var(--paper);border:1px solid var(--line);padding:4px 8px;border-radius:7px}
.dr-pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--paper);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.dr-pill.br{background:#FFE4E8;color:#B42339;border-color:transparent}
.dr-x{margin-left:auto;width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--ink2);font-size:22px;line-height:1;cursor:pointer}
.dr-x:hover{background:var(--paper)}
.dr-ttl{margin:12px 0 2px;font-size:20px;letter-spacing:-.015em}
.dr-meta{color:var(--mut);font-size:13px;margin:0 0 14px}
.dr-meta b{color:var(--ink2);font-weight:600}
.dr-stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.dr-stat{padding:12px 14px;border-right:1px solid var(--line)}
.dr-stat:last-child{border-right:0}
.dr-stat small{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.dr-stat b{display:block;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.dr-stat b.br,.dr-late{color:#B42339}
.dr-stat span{font-size:12px;color:var(--mut)}
.dr-next{display:flex;gap:12px;background:var(--paper);border-radius:12px;padding:12px 14px 12px 18px;margin-bottom:14px;position:relative;overflow:hidden}
.dr-next::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#FFCC00}
.dr-next b{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.dr-next p{margin:3px 0 0;font-size:13.5px;color:var(--ink2)}
.dr-tabs{display:flex;gap:4px;margin:0 -22px;padding:0 22px}
.dr-tabs button{position:relative;height:42px;padding:0 12px;border:0;background:transparent;font:600 13.5px var(--font);color:var(--mut);cursor:pointer}
.dr-tabs button.on{color:var(--ink)}
.dr-tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;background:var(--ink);border-radius:3px 3px 0 0}
.dr-body{flex:1;overflow:auto;padding:18px 22px 28px}
.dr-pane{display:none}
.dr-pane.on{display:block}
.dr-facts{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;margin-bottom:18px}
.dr-facts div{padding:9px 0;border-bottom:1px solid #EEECE6}
.dr-facts small{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.dr-facts span{font-size:13.5px}
.dr-sec{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:20px 0 8px}
.dr-details{font-size:13.5px;color:var(--ink2);margin:0}
.dr-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin:0 0 6px}
.dr-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.dr-tl{list-style:none;margin:0;padding:0;position:relative}
.dr-tl::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:var(--line)}
.dr-tl li{position:relative;padding:0 0 18px 30px}
.dr-tl li:last-child{padding-bottom:0}
.dr-dot{position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #C9C7BE;box-sizing:border-box}
.dr-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.dr-name{font-size:14px;font-weight:700}
.dr-state{font-size:12px;font-weight:600;color:var(--mut)}
.dr-txt{font-size:13px;color:var(--mut);margin:3px 0 0}
.dr-done .dr-dot{background:var(--ink);border-color:var(--ink)}
.dr-done .dr-state{color:var(--ink2)}
.dr-late .dr-dot{background:#B42339;border-color:#B42339}
.dr-late .dr-state{color:#B42339}
.dr-due .dr-dot{border-color:var(--ink)}
.dr-due .dr-state{color:var(--ink)}
.dr-lock .dr-dot{background:var(--paper);border-color:var(--line)}
.dr-lock .dr-name,.dr-lock .dr-txt{color:var(--mut)}
.dr-action{margin-top:10px;display:grid;gap:8px}
.dr-ta,.dr-sel{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink)}
.dr-ta{min-height:64px;resize:vertical}
.dr-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dr-row .dr-sel{flex:1;min-width:160px}
.dr-hint{font-size:11.5px;color:var(--mut)}
.dr-count{font-size:11.5px;color:var(--mut);margin-left:auto}
.dr-count.ok{color:#0A7A56;font-weight:600}
.dr-btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font:600 13px var(--font);color:var(--ink);cursor:pointer;white-space:nowrap}
.dr-btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.dr-btn.bee{background:#FFCC00;border-color:#FFCC00;color:var(--ink)}
.dr-btn:disabled{opacity:.4;cursor:not-allowed}
.dr-alog{list-style:none;margin:0;padding:0}
.dr-alog li{padding:12px 0;border-bottom:1px solid #EEECE6}
.dr-alog li:last-child{border-bottom:0}
.dr-alog .t{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mut)}
.dr-alog .evt{font-weight:700;color:var(--ink)}
.dr-alog .val{font-size:13.5px;font-weight:600;margin:3px 0 2px}
.dr-alog .who{font-size:12px;color:var(--mut)}
.dr-mono{font-family:var(--mono);font-size:11.5px}
.mframe{position:relative;width:390px;height:844px;margin:0 auto;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:var(--bg)}
.mscroll{height:100%;overflow:auto}
.mframe .dr-overlay{position:absolute;inset:0}
.mframe .dr-panel{top:40px;left:0;right:0;width:auto;border-left:0;border-radius:20px 20px 0 0;box-shadow:0 -20px 40px -24px rgba(23,23,28,.35)}
.mframe .dr-grab{display:block;width:40px;height:4px;border-radius:4px;background:#D6D4CB;margin:8px auto 0}
.mframe .dr-h{padding:12px 16px 0}
.mframe .dr-body{padding:14px 16px 24px}
.mframe .dr-stats{grid-template-columns:1fr 1fr 1fr}
.mframe .dr-stat{padding:10px}
.mframe .dr-stat b{font-size:18px}
.mframe .dr-facts{grid-template-columns:1fr}
.mframe .dr-ttl{font-size:18px}
.mframe .dr-tabs{margin:0 -16px;padding:0 16px}
@media (max-width:640px){
  .dr-panel{top:36px;left:0;right:0;width:auto;border-left:0;border-radius:20px 20px 0 0;box-shadow:0 -20px 40px -24px rgba(23,23,28,.35)}
  .dr-grab{display:block;width:40px;height:4px;border-radius:4px;background:#D6D4CB;margin:8px auto 0}
  .dr-h{padding:12px 16px 0}
  .dr-body{padding:14px 16px 24px}
  .dr-stats{grid-template-columns:1fr 1fr 1fr}
  .dr-facts{grid-template-columns:1fr}
  .dr-tabs{margin:0 -16px;padding:0 16px}
}

/* Half-gauge text (inside SVG, no .chart wrapper) */
.gauge{display:block;overflow:visible}
.gauge .gv{font:700 26px var(--font);fill:var(--text)}
.gauge .ax{font:500 11px var(--font);fill:var(--mut)}
.t-ink .gauge .gv{fill:#fff}
html[data-theme=dark] .t-ink .gauge .gv{fill:#F4F4F5}

/* ---------- Dark theme (CarryBee tracker, complete views) ---------- */
html[data-theme=dark]{color-scheme:dark;--paper:#0E0F12;--card:#16171C;--line:#2A2E36;--line2:#22252C;--track:#22252C;--grid:#1C1F25;--mut:#8B919B;--text:#F4F4F5;--ink:#F4F4F5;--ink2:#C4C9D2;--bg:#0A0B0D;--surface:#16171C}
html[data-theme=dark] body{background:#0A0B0D;color:var(--text)}
html[data-theme=dark] .mframe{background:#0A0B0D}

/* header and tabs */
html[data-theme=dark] .top,
html[data-theme=dark] .app-top{background:#16171C;border-bottom-color:#2A2E36}
html[data-theme=dark] .tabs,
html[data-theme=dark] .app-tabs{background:#1C1F25;border-color:#2A2E36}
html[data-theme=dark] .tabs button.on,
html[data-theme=dark] .app-tabs a.on{background:#2A2E36;color:#F4F4F5;box-shadow:none}
html[data-theme=dark] .who .av{background:#22252C;border-color:#2A2E36;color:#F4F4F5}
html[data-theme=dark] .clock{background:rgba(0,229,160,.14);color:#4DF5BC}
html[data-theme=dark] .ibtn,
html[data-theme=dark] .signout{background:#16171C;border-color:#2A2E36;color:#F4F4F5}
html[data-theme=dark] .ibtn:hover,
html[data-theme=dark] .signout:hover{background:#1C1F25}

/* inputs and controls */
html[data-theme=dark] .input,
html[data-theme=dark] .dr-ta,
html[data-theme=dark] .dr-sel{background:#0E0F12;border-color:#2A2E36;color:#F4F4F5}
html[data-theme=dark] .dropzone{background:#121418;border-color:#2A2E36;color:#A3A9B3}
html[data-theme=dark] .hubnote{background:rgba(0,229,160,.12);color:#A7F3D9}
html[data-theme=dark] .btn{background:#1C1F25;border-color:#2A2E36;color:#F4F4F5}
html[data-theme=dark] .btn.primary,
html[data-theme=dark] .seg .on,
html[data-theme=dark] .chip.on,
html[data-theme=dark] .dr-btn.ink{background:#F4F4F5;border-color:#F4F4F5;color:#08090B}
html[data-theme=dark] .btn.bee,
html[data-theme=dark] .dr-btn.bee,
html[data-theme=dark] .t-bee{color:#08090B}
html[data-theme=dark] .t-ink{background:#1C1F25;border-color:#2A2E36;color:#F4F4F5}
html[data-theme=dark] .t-ink .lab{color:#A3A9B3}
html[data-theme=dark] .t-ink .gv{fill:#F4F4F5}
html[data-theme=dark] .avatar{background:#2A2E36;color:#F4F4F5}
html[data-theme=dark] .stage .bar i{background:#F4F4F5}
html[data-theme=dark] .seg2 button.on,
html[data-theme=dark] .folder.on{background:#2A2E36;color:#F4F4F5}

/* status pills */
html[data-theme=dark] .p-urg{background:rgba(255,84,112,.16);color:#FF8DA0}
html[data-theme=dark] .p-crit{background:rgba(255,204,0,.14);color:#FFD84D}
html[data-theme=dark] .p-reg,
html[data-theme=dark] .p-ok{background:rgba(0,229,160,.14);color:#4DF5BC}
html[data-theme=dark] .p-wait{background:rgba(55,169,255,.16);color:#7CC3FF}
html[data-theme=dark] .p-res{background:rgba(255,255,255,.06);color:#A3A9B3}
html[data-theme=dark] .good{color:#4DF5BC}
html[data-theme=dark] .bad{color:#FF8DA0}

/* issue drawer */
html[data-theme=dark] .dr-scrim{background:rgba(0,0,0,.6)}
html[data-theme=dark] .dr-panel{background:#16171C;border-left-color:#2A2E36;color:#F4F4F5;box-shadow:-24px 0 48px -32px rgba(0,0,0,.8)}
html[data-theme=dark] .mframe .dr-panel{box-shadow:0 -20px 40px -24px rgba(0,0,0,.8)}
html[data-theme=dark] .dr-pill.br{background:rgba(255,84,112,.16);color:#FF8DA0;border-color:transparent}
html[data-theme=dark] .dr-pill{background:#1C1F25;border-color:#2A2E36}
html[data-theme=dark] .dr-btn{background:#1C1F25;border-color:#2A2E36;color:#F4F4F5}
html[data-theme=dark] .dr-btn.ink{background:#F4F4F5;border-color:#F4F4F5;color:#08090B}
html[data-theme=dark] .dr-btn.bee{background:#FFCC00;border-color:#FFCC00;color:#08090B}
html[data-theme=dark] .dr-facts div,
html[data-theme=dark] .dr-alog li{border-bottom-color:#22252C}
html[data-theme=dark] .dr-dot{background:#16171C;border-color:#3A3F49}
html[data-theme=dark] .dr-done .dr-dot{background:#F4F4F5;border-color:#F4F4F5}
html[data-theme=dark] .dr-tabs button.on::after{background:#F4F4F5}
html[data-theme=dark] .dr-tabs button.on{color:#F4F4F5}
html[data-theme=dark] .dr-next{background:#1C1F25}
html[data-theme=dark] .mframe .dr-grab{background:#3A3F49}

/* inline-styled elements (grade badges, draft pill, legend, channel field) */
html[data-theme=dark] [style*="#F1F0EB"]{background:#2A2E36!important;color:#F4F4F5!important}
html[data-theme=dark] [style*="#F6F5F1"]{background:#0E0F12!important}
html[data-theme=dark] [style*="background:#fff"]{background:#16171C!important}
html[data-theme=dark] [style*="#CFF8E9"]{background:rgba(0,229,160,.14)!important;color:#4DF5BC!important}
html[data-theme=dark] [style*="#FFF3C2"]{background:rgba(255,204,0,.14)!important;color:#FFD84D!important}
html[data-theme=dark] [style*="#FFE6D6"]{background:rgba(255,140,60,.16)!important;color:#FFB27A!important}
html[data-theme=dark] [style*="#FFE4E9"]{background:rgba(255,84,112,.16)!important;color:#FF8DA0!important}

/* gauge arc: the green "target met" stroke is too dark on the dark card */
html[data-theme=dark] .gauge path[stroke="#0A7A56"]{stroke:#00E5A0}

/* charts and bars: near-black series colours become light; mint replaces dark green */
html[data-theme=dark] svg [stroke="#08090B"]{stroke:#F4F4F5}
html[data-theme=dark] svg [fill="#08090B"]{fill:#F4F4F5}
html[data-theme=dark] svg [stop-color="#08090B"]{stop-color:#F4F4F5}
html[data-theme=dark] svg [stroke="#0A7A56"]{stroke:#00E5A0}
html[data-theme=dark] svg [fill="#0A7A56"]{fill:#00E5A0}
html[data-theme=dark] svg [stop-color="#0A7A56"]{stop-color:#00E5A0}
html[data-theme=dark] [style*="background:#08090B"]{background:#F4F4F5!important}
html[data-theme=dark] [style*="background:#111216"]{background:#C4C9D2!important}
html[data-theme=dark] [style*="background:#0A7A56"]{background:#00E5A0!important}
</style>
</head>

/* ---------- Helpers ---------- */
let SEQ = 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Number(n).toLocaleString('en-US');
function niceMax(v){ if(!(v>0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v/p)*p; }

/* Catmull-Rom through points, converted to cubic Bezier: a smooth "wave" line */
function smooth(pts){
  if(pts.length < 2) return '';
  let d = 'M' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1);
  for(let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    const c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
    const c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
    d += ' C' + c1x.toFixed(1) + ',' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ',' + c2y.toFixed(1) + ' ' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1);
  }
  return d;
}

/* Wave chart: one or more smooth area/line series with gradient fills */
function wave(o){
  const W = o.w || 640, H = o.h || 230, pl = 36, pr = 12, pt = 14, pb = 26;
  const iw = W - pl - pr, ih = H - pt - pb;
  const all = o.series.flatMap(s => s.data);
  const max = niceMax(Math.max(...all));
  const n = o.labels.length;
  const x = i => pl + (n === 1 ? iw/2 : i * iw / (n - 1));
  const y = v => pt + ih * (1 - v / max);
  const id = 'w' + (++SEQ);
  let g = '';
  for(let k = 0; k <= 4; k++){
    const v = max * k / 4, yy = y(v);
    g += '<line class="gl" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yy + '" y2="' + yy + '"/>';
    g += '<text class="ax" x="' + (pl - 8) + '" y="' + (yy + 4) + '" text-anchor="end">' + Math.round(v) + '</text>';
  }
  let xl = '';
  o.labels.forEach((l, i) => {
    if(i % (o.every || 1) === 0 || i === n - 1) xl += '<text class="ax" x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(l) + '</text>';
  });
  let paths = '', defs = '';
  o.series.forEach((s, si) => {
    const pts = s.data.map((v, i) => [x(i), y(v)]);
    const line = smooth(pts);
    const gid = id + 'g' + si;
    defs += '<linearGradient id="' + gid + '" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="' + s.color + '" stop-opacity="' + (s.fillOpacity ?? 0.22) + '"/><stop offset="1" stop-color="' + s.color + '" stop-opacity="0"/></linearGradient>';
    if(s.fill !== false) paths += '<path d="' + line + ' L' + x(n-1) + ',' + (pt + ih) + ' L' + x(0) + ',' + (pt + ih) + ' Z" fill="url(#' + gid + ')"/>';
    paths += '<path d="' + line + '" fill="none" stroke="' + s.color + '" stroke-width="' + (s.width || 2.25) + '" stroke-linecap="round" stroke-linejoin="round"/>';
    const last = pts[pts.length - 1];
    paths += '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="4.5" fill="' + s.color + '" stroke="' + (o.bg || '#fff') + '" stroke-width="2"/>';
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label || 'Trend') + '"><defs>' + defs + '</defs>' + g + paths + xl + '</svg>';
}

/* Mini wave for KPI cards: no axes */
function spark(data, color){
  const W = 160, H = 40;
  const max = Math.max(...data), min = Math.min(...data), span = (max - min) || 1;
  const pts = data.map((v, i) => [i * W / (data.length - 1), 4 + (H - 8) * (1 - (v - min) / span)]);
  const d = smooth(pts);
  const id = 's' + (++SEQ);
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="' + id + '" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="' + color + '" stop-opacity=".25"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs><path d="' + d + ' L' + W + ',' + H + ' L0,' + H + ' Z" fill="url(#' + id + ')"/><path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
}

/* Vertical rounded bars */
function bars(o){
  const W = o.w || 320, H = o.h || 200, pb = 28, pt = 22;
  const ih = H - pb - pt;
  const max = niceMax(Math.max(...o.items.map(i => i.value), 1));
  const n = o.items.length, gap = 16, bw = (W - gap * (n + 1)) / n;
  let s = '';
  o.items.forEach((it, i) => {
    const h = ih * it.value / max, x = gap + i * (bw + gap), y = pt + ih - h;
    if(it.value > 0){
      const r = Math.max(0, Math.min(10, bw/2, h/2));
      s += '<path d="M' + x + ',' + (pt + ih) + ' V' + (y + r) + ' Q' + x + ',' + y + ' ' + (x + r) + ',' + y + ' H' + (x + bw - r) + ' Q' + (x + bw) + ',' + y + ' ' + (x + bw) + ',' + (y + r) + ' V' + (pt + ih) + ' Z" fill="' + it.color + '"/>';
    }
    s += '<text class="val" x="' + (x + bw/2) + '" y="' + (y - 7) + '" text-anchor="middle">' + fmt(it.value) + '</text>';
    s += '<text class="ax" x="' + (x + bw/2) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(it.label) + '</text>';
  });
  s += '<line class="base" x1="0" x2="' + W + '" y1="' + (pt + ih) + '" y2="' + (pt + ih) + '"/>';
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Bar chart">' + s + '</svg>';
}

/* Horizontal bars (HTML) */
function hbars(rows, color){
  const max = Math.max(...rows.map(r => r.value), 1);
  return rows.map(r => '<div class="hbar"><span>' + esc(r.label) + '</span><div class="track"><div class="fill" style="width:' + (r.value / max * 100).toFixed(1) + '%;background:' + (r.color || color) + '"></div></div><b>' + fmt(r.value) + '</b></div>').join('');
}

/* Donut: ring with centre label */
function donut(o){
  const S = o.size || 170, sw = o.stroke || 20, r = (S - sw) / 2, c = 2 * Math.PI * r;
  const total = o.segments.reduce((a, b) => a + b.value, 0) || 1;
  const gapPx = o.gap == null ? 3 : o.gap;
  let off = 0, arcs = '';
  o.segments.forEach(seg => {
    const len = c * seg.value / total;
    const dash = Math.max(0, len - gapPx);
    arcs += '<circle cx="' + S/2 + '" cy="' + S/2 + '" r="' + r + '" fill="none" stroke="' + seg.color + '" stroke-width="' + sw + '" stroke-dasharray="' + dash.toFixed(2) + ' ' + (c - dash).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 ' + S/2 + ' ' + S/2 + ')"/>';
    off += len;
  });
  const track = '<circle cx="' + S/2 + '" cy="' + S/2 + '" r="' + r + '" fill="none" stroke="' + (o.track || 'rgba(128,128,128,.12)') + '" stroke-width="' + sw + '"/>';
  return '<div class="donut" style="width:' + S + 'px;height:' + S + 'px"><svg width="' + S + '" height="' + S + '" viewBox="0 0 ' + S + ' ' + S + '" role="img" aria-label="' + esc(o.center) + ' ' + esc(o.sub || '') + '">' + track + arcs + '</svg><div class="dc"><b>' + esc(o.center) + '</b><span>' + esc(o.sub || '') + '</span></div></div>';
}

/* Pie: solid slices */
function pie(o){
  const S = o.size || 170, cx = S/2, cy = S/2, R = S/2 - 3;
  const total = o.segments.reduce((a, b) => a + b.value, 0) || 1;
  let a = -Math.PI/2, s = '';
  o.segments.forEach(seg => {
    const ang = 2 * Math.PI * seg.value / total;
    if(ang <= 0) return;
    if(ang >= 2 * Math.PI - 1e-6){ s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="' + seg.color + '"/>'; return; }
    const a2 = a + ang, large = ang > Math.PI ? 1 : 0;
    const x1 = cx + R * Math.cos(a), y1 = cy + R * Math.sin(a), x2 = cx + R * Math.cos(a2), y2 = cy + R * Math.sin(a2);
    s += '<path d="M' + cx + ',' + cy + ' L' + x1.toFixed(2) + ',' + y1.toFixed(2) + ' A' + R + ',' + R + ' 0 ' + large + ' 1 ' + x2.toFixed(2) + ',' + y2.toFixed(2) + ' Z" fill="' + seg.color + '" stroke="' + (o.bg || '#fff') + '" stroke-width="2"/>';
    a = a2;
  });
  return '<svg class="pie" width="' + S + '" height="' + S + '" viewBox="0 0 ' + S + ' ' + S + '" role="img" aria-label="Pie chart">' + s + '</svg>';
}

/* Half gauge (0–100) */
function gauge(o){
  const W = o.w || 200, R = W/2 - 14, cx = W/2, cy = W/2;
  const t = Math.max(0, Math.min(100, o.value)) / 100;
  const pnt = a => [cx + R * Math.cos(a), cy + R * Math.sin(a)];
  const start = pnt(Math.PI), end = pnt(2 * Math.PI);
  const endAng = Math.PI + Math.PI * t, tip = pnt(endAng);
  const large = t > 0.5 ? 1 : 0;
  return '<svg class="gauge" viewBox="0 0 ' + W + ' ' + (W/2 + 16) + '" width="100%" role="img" aria-label="' + esc(o.label || 'Gauge') + ' ' + esc(o.center) + '">' +
    '<path d="M' + start[0] + ',' + start[1] + ' A' + R + ',' + R + ' 0 0 1 ' + end[0] + ',' + end[1] + '" fill="none" stroke="' + (o.track || 'rgba(128,128,128,.14)') + '" stroke-width="14" stroke-linecap="round"/>' +
    (t > 0 ? '<path d="M' + start[0] + ',' + start[1] + ' A' + R + ',' + R + ' 0 0 1 ' + tip[0] + ',' + tip[1] + '" fill="none" stroke="' + o.color + '" stroke-width="14" stroke-linecap="round"/>' : '') +
    '<text class="gv" x="' + cx + '" y="' + (cy - 6) + '" text-anchor="middle">' + esc(o.center) + '</text>' +
    '<text class="ax" x="' + cx + '" y="' + (cy + 12) + '" text-anchor="middle">' + esc(o.sub || '') + '</text></svg>';
}

/* Stacked horizontal bar with legend */
function stackbar(items){
  const tot = items.reduce((a, b) => a + b.value, 0) || 1;
  return '<div class="stackbar">' + items.map(i => '<i style="width:' + (i.value / tot * 100).toFixed(2) + '%;background:' + i.color + '" title="' + esc(i.label) + ' ' + i.value + '"></i>').join('') + '</div>' +
    '<div class="legend" style="margin-top:12px">' + items.map(i => '<span><i style="background:' + i.color + '"></i>' + esc(i.label) + ' ' + fmt(i.value) + '</span>').join('') + '</div>';
}

function legend(items){ return '<div class="legend">' + items.map(i => '<span><i style="background:' + i.c + '"></i>' + esc(i.l) + '</span>').join('') + '</div>'; }

const FOLDER_ICON = {dashboard:'zone', analytics:'trend', tracker:'escalation', hubs:'hub', teams:'team', kam:'kam', mx:'mx', admin:'layers', sync:'sync'};
const ROLES = {
  cm:    ['dashboard','analytics','tracker','hubs','teams','kam'],
  admin: PAGES.map(p => p[0])
};
const ROLE_TAG = {cm:'cm_lead', admin:'admin'};
let CURRENT_ROLE = 'cm';
function roleAllows(k){ return ROLES[CURRENT_ROLE].includes(k); }
function renderTabs(){
  document.getElementById('app-tabs').innerHTML = PAGES.filter(p => roleAllows(p[0])).map(p =>
    '<a class="folder" href="#/' + p[0] + '" data-p="' + p[0] + '">' + ic(FOLDER_ICON[p[0]]) + p[1] + '</a>').join('');
}
function renderApp(){
  const main = document.getElementById('app-main');
  main.innerHTML = PAGES.map(p => '<section class="page" id="pg-' + p[0] + '">' + p[2]() + '</section>').join('');
  renderTabs();
}
function route(){
  const key = (location.hash || '#/dashboard').replace('#/', '') || 'dashboard';
  const valid = (PAGES.some(p => p[0] === key) && roleAllows(key)) ? key : 'dashboard';
  document.querySelectorAll('.page').forEach(s => s.classList.toggle('on', s.id === 'pg-' + valid));
  document.querySelectorAll('#app-tabs a').forEach(a => {
    const on = a.dataset.p === valid;
    a.classList.toggle('on', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  window.scrollTo(0, 0);
}
function setRole(r){
  CURRENT_ROLE = r;
  document.querySelectorAll('[data-role]').forEach(b => {
    const on = b.dataset.role === r;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  document.getElementById('signout').setAttribute('aria-label', 'AAR, sign out, ' + ROLE_TAG[r]);
  document.getElementById('role-tag').textContent = ROLE_TAG[r];
  const cur = (location.hash || '').replace('#/', '');
  if (cur && !roleAllows(cur)) location.hash = '#/dashboard';
  renderTabs();
  route();
}
function setMode(mode){
  const d = document.getElementById('dash');
  if(!d) return;
  d.classList.toggle('mode-phone', mode === 'phone');
  d.querySelectorAll('[data-mode]').forEach(s => s.classList.toggle('on', s.dataset.mode === mode));
}
if(typeof document !== 'undefined' && document.getElementById && document.getElementById('app-main')){
  renderApp();
  document.body.insertAdjacentHTML('afterbegin', sprite());
  window.addEventListener('hashchange', route);
  document.addEventListener('click', e => {
    const m = e.target.closest('[data-mode]');
    if(m) setMode(m.dataset.mode);
  });
  route();
}




document.addEventListener('click', e => {
  const b = e.target.closest('[data-role]');
  if (b) setRole(b.dataset.role);
});

let DR_LAST = null;
function openIssue(id){
  const r = QUEUE.find(x => x.id === id);
  if (!r) return;
  DR_LAST = document.activeElement;
  document.getElementById('dr-panel').innerHTML = drHTML(r);
  document.getElementById('dr-overlay').classList.add('on');
  const x = document.querySelector('#dr-panel .dr-x');
  if (x) x.focus();
}
function closeIssue(){
  document.getElementById('dr-overlay').classList.remove('on');
  if (DR_LAST && DR_LAST.focus) DR_LAST.focus();
}
document.addEventListener('click', e => {
  const row = e.target.closest('[data-issue]');
  if (row && !e.target.closest('#dr-overlay')) { openIssue(row.dataset.issue); return; }
  if (e.target.id === 'dr-overlay' || e.target.classList.contains('dr-scrim') || e.target.closest('.dr-x')) { closeIssue(); return; }
  const t = e.target.closest('[data-dtab]');
  if (t) {
    const name = t.dataset.dtab;
    document.querySelectorAll('#dr-panel [data-dtab]').forEach(b => { const on = b.dataset.dtab === name; b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
    document.querySelectorAll('#dr-panel [data-pane]').forEach(p => p.classList.toggle('on', p.dataset.pane === name));
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('dr-overlay').classList.contains('on')) closeIssue();
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.qi[data-issue]')) openIssue(e.target.dataset.issue);
});
document.addEventListener('input', e => {
  if (!e.target.classList || !e.target.classList.contains('dr-ta')) return;
  const panel = e.target.closest('#dr-panel');
  const n = e.target.value.trim().length;
  const ct = panel.querySelector('.dr-count');
  const btn = panel.querySelector('.dr-submit');
  ct.textContent = n + ' characters · min 20';
  ct.classList.toggle('ok', n >= 20);
  if (btn) btn.disabled = n < 20;
});

/* ---- theme toggle (session only; the page opens in its build default) ---- */
(function () {
  var root = document.documentElement;
  var SUN = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    document.querySelectorAll('img.logo').forEach(function (img) {
      img.src = t === 'dark' ? LOGO_DARK : LOGO_LIGHT;
    });
    document.querySelectorAll('button[aria-label="Dark mode"],button[aria-label="Light mode"]').forEach(function (b) {
      var dark = t === 'dark';
      b.setAttribute('aria-label', dark ? 'Light mode' : 'Dark mode');
      b.setAttribute('title', dark ? 'Light mode' : 'Dark mode');
      b.innerHTML = dark ? SUN : MOON;
      b.setAttribute('aria-pressed', dark ? 'true' : 'false');
    });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button[aria-label="Dark mode"],button[aria-label="Light mode"]');
    if (!b) return;
    applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  applyTheme(window.__CB_THEME__ || 'light');
})();
